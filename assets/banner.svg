<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0c1833" />
      <stop offset="100%" stop-color="#081124" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2a4a" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.2" fill="#00b4d8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 1.5px;
      fill: #ffffff;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      fill: #00f5d4;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Scanner Ring (Radiology CT Gantry motif) -->
  <g transform="translate(1000, 210)">
    <!-- Outer static ring -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#16294d" stroke-width="2" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1e3a6d" stroke-width="1.5" stroke-dasharray="6,6" />
    
    <!-- Rotating pulsed ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#00b4d8" stroke-width="2" stroke-dasharray="70 40 20 40" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
    </circle>
    
    <!-- Counter-rotating inner ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-dasharray="30 25 10 25" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
    </circle>
    
    <!-- Central DICOM sensor target -->
    <circle cx="0" cy="0" r="35" fill="#0c1d3f" stroke="#00b4d8" stroke-width="2" />
    <circle cx="0" cy="0" r="8" fill="#00f5d4">
      <animate attributeName="r" values="6;10;6" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Reticle crosshairs -->
    <line x1="-165" y1="0" x2="165" y2="0" stroke="#00b4d8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />
    <line x1="0" y1="-165" x2="0" y2="165" stroke="#00b4d8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />
  </g>

  <!-- Dynamic Scanning Beam Effect -->
  <rect x="0" y="0" width="120" height="420" fill="url(#scanGrad)">
    <animate attributeName="x" values="-150;1200" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Left Content Block -->
  <g transform="translate(80, 75)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0e2347" stroke="#00f5d4" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#00f5d4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="22" class="badge-text">HEALTHCARE IT &amp; IMAGING ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="88" class="title-text">
      Awesome <tspan fill="url(#cyanAccent)">Radiology Information</tspan>
    </text>
    <text x="0" y="140" class="title-text">
      Systems <tspan fill="#00b4d8">&amp; Imaging Platforms</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" class="sub-text">
      Curated guide to SaaS RIS, Cloud PACS, Modality Worklists (MWL),
    </text>
    <text x="0" y="213" class="sub-text">
      Diagnostic Web Viewers, Teleradiology &amp; Open-Source Clinical Tools.
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 245)">
      <!-- Tag 1: Cloud RIS -->
      <rect x="0" y="0" width="120" height="32" rx="6" fill="#132442" stroke="#254375" stroke-width="1" />
      <text x="14" y="20" class="tag-text">🩻 Cloud RIS</text>

      <!-- Tag 2: PACS & VNA -->
      <rect x="132" y="0" width="132" height="32" rx="6" fill="#132442" stroke="#254375" stroke-width="1" />
      <text x="144" y="20" class="tag-text">📦 PACS / VNA</text>

      <!-- Tag 3: DICOM & HL7 -->
      <rect x="276" y="0" width="146" height="32" rx="6" fill="#132442" stroke="#254375" stroke-width="1" />
      <text x="288" y="20" class="tag-text">⚡ DICOM &amp; HL7</text>

      <!-- Tag 4: Open Source -->
      <rect x="434" y="0" width="144" height="32" rx="6" fill="#132442" stroke="#254375" stroke-width="1" />
      <text x="446" y="20" class="tag-text">🌟 Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="415" width="1200" height="5" fill="url(#cyanAccent)" />
</svg>